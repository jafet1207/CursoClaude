# Puerta de calidad de Cancha Total F5. Corre en cada push y en cada pull request contra
# main, sin credenciales de ningún servicio externo. El job "verificacion" es obligatorio
# para poder fusionar (ver la protección de la rama main); no hay ningún job informativo
# todavía.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificacion:
    name: Verificación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - run: npm ci
      - run: ./verificarr.sh
